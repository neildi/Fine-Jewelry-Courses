    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Where jade comes from</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Jadeite: Nephrite: Note where jadeite and nephrite dominate commercially:</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">fine jadeite is overwhelmingly a...</text>
