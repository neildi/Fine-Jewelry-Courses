    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Colorless corundum — white sapphire — is a real, natural, Mohs-9 gemstone</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">and a legitimate choice for a...</text>
