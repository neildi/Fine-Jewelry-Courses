  <g transform="translate(46, 158)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Two clients, one skill</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">The first client wants a padparadscha sapphire for her twentieth</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">anniversary.</text>
