  <rect width="1100" height="688" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="1096" height="684" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <g transform="translate(46, 34)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FB7185" fill-opacity="0.18"/>
    <text x="70.2" y="16" fill="#FB7185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MODULE FRAMEWORK</text>
    <text x="1008" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1.2">C17 · MODULE 06</text>
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Inclusions and the Micro-World: Reading Origin, Treatment, and</text>
    <text x="0" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">History Under 10×</text>
  </g>
  <g transform="translate(46, 158)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">The estate ruby that could be five things</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">An estate client brings in a ring set with a 3.02 ct red oval in a worn</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">yellow-gold mounting.</text>
  </g>
  <g transform="translate(559, 158)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">What is an inclusion?</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">A strict definition of an inclusion is any material trapped inside a gem</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">during or after its formation.</text>
  </g>
  <g transform="translate(46, 280)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Classifying inclusions: time and type</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Gemologists categorize inclusions by when they formed relative to the host</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">crystal: - Protogenetic inclusions...</text>
  </g>
  <g transform="translate(559, 280)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Famous diagnostic inclusions: what they look like and what they mean</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Some inclusions are so strongly associated with a particular origin or</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">species that they act as a first-pass...</text>
  </g>
  <g transform="translate(46, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Treatment inclusions: what treated stones look like under 10×</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Treatments leave telltale evidence.</text>
  </g>
  <g transform="translate(559, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">6</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Synthetic signatures: what man-made stones look like under</text>
    <text x="56" y="44" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">magnification</text>
    <text x="22" y="69" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Synthetics are covered in depth in M08, but the classic 10× signatures are...</text>
  </g>
  <g transform="translate(46, 524)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">7</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">How labs actually do origin determination</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">If inclusions alone were enough, origin reports would be quick and cheap.</text>
  </g>
  <g transform="translate(559, 524)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">8</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Loupe discipline and when to refer to a lab</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Proper 10× loupe technique takes an hour to learn and years to master.</text>
