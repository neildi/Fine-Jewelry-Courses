<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 688" width="100%" height="100%" role="img">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#E5C378"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="688" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="1096" height="684" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <g transform="translate(46, 34)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#FB7185" fill-opacity="0.18"/>
    <text x="70.2" y="16" fill="#FB7185" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MODULE FRAMEWORK</text>
    <text x="1008" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1.2">C17 · MODULE 04</text>
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Physical Properties: Hardness, Toughness, Stability, RI, SG,</text>
    <text x="0" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">and Durability in Design</text>
  </g>
  <g transform="translate(46, 158)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">The tanzanite that came back cracked</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Three months after purchase a client returns with a tanzanite ring.</text>
  </g>
  <g transform="translate(559, 158)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Durability has three parts, not one</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">When a client asks &quot;is this stone durable?&quot;, the answer has three</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">dimensions.</text>
  </g>
  <g transform="translate(46, 280)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Hardness and the Mohs scale</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Friedrich Mohs, a 19th-century Austrian mineralogist, created the scale that</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">still bears his name.</text>
  </g>
  <g transform="translate(559, 280)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cleavage, fracture, and toughness: why hardness misleads</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Cleavage is a plane of weakness in the crystal where atomic bonds are weaker</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">in one direction.</text>
  </g>
  <g transform="translate(46, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Optical constants: RI, birefringence, dispersion, SG</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">You are not a gemologist — that is what a lab is for — but three numbers</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">help you understand what a...</text>
  </g>
  <g transform="translate(559, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">6</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Stability: heat, light, chemicals, humidity</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">The third dimension of durability is where most post-sale damage happens.</text>
  </g>
  <g transform="translate(46, 524)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">7</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">What this means for mounting and care</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Durability determines how a stone should be set and worn.</text>
  </g>
  <g transform="translate(559, 524)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">8</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">On the floor this week</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">- Monday (5 minutes): Pull out a refractometer if your store has one and ask</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">a gemologist to show you how...</text>
  </g>
  <text x="46" y="668" fill="#C5A059" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">JEWELSWELL MASTER ACADEMY</text>
  <text x="1054" y="668" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="end">Generated from the module article — headings and takeaways verbatim.</text>
</svg>
