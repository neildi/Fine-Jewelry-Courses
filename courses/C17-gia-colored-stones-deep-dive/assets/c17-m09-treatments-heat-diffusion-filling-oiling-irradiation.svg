    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Reading a GIA colored-stone report</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">GIA reports use standardized comment language.</text>
  </g>
  <g transform="translate(46, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Counter scripts for disclosure</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Disclosure needs to be simple and happen before the client makes a decision,</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">not after.</text>
  </g>
  <g transform="translate(559, 402)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">6</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Care by treatment: quick reference</text>
  </g>
  <g transform="translate(46, 524)">
    <rect width="495" height="104" rx="10" fill="#1E293B" stroke="#FB7185" stroke-width="1.4" stroke-opacity="0.85"/>
    <rect width="4" height="104" rx="2" fill="#FB7185"/>
    <circle cx="32" cy="30" r="14" fill="#FB7185" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FB7185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">7</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">On the floor: applying it this week</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">- Monday (10 minutes): Pull three treated stones from your case and locate</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">the treatment comment on their lab...</text>
  </g>
