    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Treatment by treatment</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">&gt; One thing to emphasize: simple heat treatment of corundum (dissolving</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">silk, altering color) is so standard...</text>
  </g>
  <g transform="translate(559, 280)">
