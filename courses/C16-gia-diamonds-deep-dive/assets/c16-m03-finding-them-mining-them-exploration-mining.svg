    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Marine mining, the detail most courses skip</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Gurney &amp; Levinson (G&amp;G Winter 1991) on De Beers Marine off Namibia: at that</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">time, the sea-floor concessions...</text>
