    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Self-critique rubric (Step 2, compact)</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Outcome 5; factual discipline 5 (all figures verbatim from the four G&amp;G</text>
