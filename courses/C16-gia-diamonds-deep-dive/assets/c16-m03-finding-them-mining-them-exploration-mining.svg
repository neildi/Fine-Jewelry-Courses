    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">One mine breaks every row — Argyle (Shigley, Chapman &amp; Ellison, G&amp;G Spring</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">2001): an Australian lamproite,...</text>
