    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">How diamonds are found: a five-step method, with its Canadian proof</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Exploration is one of the most failure-dense businesses on Earth.</text>
