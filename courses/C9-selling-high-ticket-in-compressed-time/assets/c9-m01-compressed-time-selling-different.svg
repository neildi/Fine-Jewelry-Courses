    <circle cx="26" cy="61" r="3.2" fill="#FBBF24"/>
    <text x="40" y="65" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400">Real compressed-time formats (trunk shows, onboard cruise seminars, pop-up/VIP events) share this core time constraint...</text>
    <circle cx="26" cy="80" r="3.2" fill="#FBBF24"/>
    <text x="40" y="84" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400">Genuine urgency comes from a real, specific, honestly stated constraint; manufactured pressure (fake scarcity, invented...</text>
    <circle cx="26" cy="99" r="3.2" fill="#FBBF24"/>
    <text x="40" y="103" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400">Because there's no second visit, discovery must compress without becoming shallow, trust must build through different...</text>
