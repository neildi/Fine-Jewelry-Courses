    <rect width="4" height="118" rx="2" fill="#FBBF24"/>
    <circle cx="32" cy="30" r="14" fill="#FBBF24" fill-opacity="0.22"/>
    <text x="32" y="35" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Real Formats, Real Constraints</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Compressed-time selling isn't one situation — it's a family of formats that</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">share the same underlying time pressure but differ in scale and...</text>
