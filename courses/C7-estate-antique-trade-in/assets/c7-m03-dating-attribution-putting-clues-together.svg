    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Weighing Evidence: Building Toward a Confident Conclusion</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Once the individual pieces of evidence are gathered, the actual attribution</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">work is about weighing them, not simply listing them.</text>
