    <text x="32" y="35" fill="#FB923C" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1</text>
    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">The Systematic Examination Process</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">Before any conclusions get drawn, a piece needs to be examined methodically,</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">not glanced at.</text>
