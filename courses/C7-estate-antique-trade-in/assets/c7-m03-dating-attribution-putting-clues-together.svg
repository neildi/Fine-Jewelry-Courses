    <text x="56" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Married Jewelry: When a Piece Isn't All One Thing</text>
    <text x="22" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">A genuinely important concept for this module is the married jewel</text>
    <text x="22" y="67" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">(sometimes called a &quot;marriage&quot;): a piece created in the style of a specific</text>
    <text x="22" y="82" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="400">period...</text>
