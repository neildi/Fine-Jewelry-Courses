<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#FDF0CD"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <linearGradient id="diamondFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="996" height="646" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="90" y="16" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">JEWELSWELL REFERENCE</text>
    <text x="0" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Diamond Anatomy &amp; Ideal Proportions Guide</text>
    <text x="0" y="74" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Standard Round Brilliant cut parameters benchmarked to GIA Excellent cut standards.</text>
  </g>

  <!-- Main Diamond Profile Diagram -->
  <g transform="translate(180, 200)">
    <!-- Dimension lines & Guide zones -->
    <!-- Table Width 53-58% -->
    <line x1="80" y1="-25" x2="320" y2="-25" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="80" y1="-30" x2="80" y2="-20" stroke="#38BDF8" stroke-width="2"/>
    <line x1="320" y1="-30" x2="320" y2="-20" stroke="#38BDF8" stroke-width="2"/>
    <rect x="140" y="-42" width="120" height="22" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="200" y="-27" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Table: 54 – 57%</text>

    <!-- Crown Angle 34-35 deg -->
    <path d="M 0,60 L 50,60" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 35,60 A 35 35 0 0 0 28,40" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="-40" y="42" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">34.0° – 35.0°</text>
    <text x="-40" y="56" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Crown Angle</text>

    <!-- Pavilion Angle 40.6 - 41.0 deg -->
    <path d="M 0,76 L 60,76" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 45,76 A 45 45 0 0 1 35,110" fill="none" stroke="#10B981" stroke-width="2"/>
    <text x="-40" y="105" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">40.6° – 41.0°</text>
    <text x="-40" y="119" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Pavilion Angle</text>

    <!-- Total Depth 59.0 - 62.5% -->
    <line x1="430" y1="0" x2="430" y2="240" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="420" y1="0" x2="440" y2="0" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="420" y1="240" x2="440" y2="240" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="445" y="105" width="155" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="455" y="123" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Total Depth: 59–62.5%</text>
    <text x="455" y="138" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Ideal: 61.0% to 62.5%</text>

    <!-- Crown Height % -->
    <line x1="410" y1="0" x2="410" y2="60" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="405" y1="0" x2="415" y2="0" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="405" y1="60" x2="415" y2="60" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="445" y="35" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Crown Ht: 14.5–16.0%</text>

    <!-- Girdle Thickness -->
    <line x1="410" y1="60" x2="410" y2="76" stroke="#A855F7" stroke-width="1.5"/>
    <text x="445" y="72" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Girdle: Med to Sl. Thick (3.5%)</text>

    <!-- Pavilion Depth % -->
    <line x1="410" y1="76" x2="410" y2="240" stroke="#10B981" stroke-width="1.5"/>
    <line x1="405" y1="240" x2="415" y2="240" stroke="#10B981" stroke-width="1.5"/>
    <text x="445" y="175" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Pavilion Depth: 43.0%</text>

    <!-- Diamond Silhouette Geometry -->
    <!-- Table Face -->
    <polygon points="80,0 320,0 400,60 0,60" fill="url(#diamondFill)" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Girdle Zone -->
    <rect x="0" y="60" width="400" height="16" fill="#94A3B8" fill-opacity="0.8" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Pavilion to Culet -->
    <polygon points="0,76 400,76 202,240 198,240" fill="url(#diamondFill)" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Facet Inner Shading Lines -->
    <!-- Table Top -->
    <line x1="80" y1="0" x2="320" y2="0" stroke="#475569" stroke-width="2"/>
    <!-- Crown Facets -->
    <polygon points="140,0 260,0 200,60" fill="#F8FAFC" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
    <line x1="80" y1="0" x2="60" y2="60" stroke="#475569" stroke-width="1"/>
    <line x1="320" y1="0" x2="340" y2="60" stroke="#475569" stroke-width="1"/>
    <line x1="140" y1="0" x2="200" y2="60" stroke="#475569" stroke-width="1"/>
    <line x1="260" y1="0" x2="200" y2="60" stroke="#475569" stroke-width="1"/>

    <!-- Pavilion Facet Mains -->
    <polygon points="200,76 200,240 120,76" fill="#F1F5F9" fill-opacity="0.4" stroke="#475569" stroke-width="1"/>
    <polygon points="200,76 200,240 280,76" fill="#E2E8F0" fill-opacity="0.5" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="76" x2="200" y2="240" stroke="#475569" stroke-width="1"/>
    <line x1="400" y1="76" x2="200" y2="240" stroke="#475569" stroke-width="1"/>

    <!-- Culet annotation -->
    <circle cx="200" cy="240" r="4" fill="#E11D48"/>
    <line x1="200" y1="246" x2="200" y2="275" stroke="#E11D48" stroke-width="1.5"/>
    <text x="200" y="292" fill="#FDA4AF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Culet: None / Pointed</text>
  </g>

  <!-- Bottom Key Fact Cards -->
  <g transform="translate(40, 520)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="290" height="95" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">57 or 58 Facets Total</text>
    <text x="15" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Crown: 33 facets (1 Table, 8 Bezel,</text>
    <text x="15" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">8 Star, 16 Upper Girdle)</text>
    <text x="15" y="82" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Pavilion: 24 facets (8 Mains, 16 Lower)</text>

    <!-- Card 2 -->
    <rect x="315" y="0" width="290" height="95" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="330" y="25" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">The 3 Light Dynamics</text>
    <text x="330" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan font-weight="700" fill="#FFFFFF">Brightness:</tspan> White light internal reflection</text>
    <text x="330" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan font-weight="700" fill="#FFFFFF">Fire:</tspan> Spectral rainbow dispersion</text>
    <text x="330" y="82" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11"><tspan font-weight="700" fill="#FFFFFF">Scintillation:</tspan> Movement sparkle &amp; contrast</text>

    <!-- Card 3 -->
    <rect x="630" y="0" width="290" height="95" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="645" y="25" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Floor Demonstration Script</text>
    <text x="645" y="48" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">"A diamond cut too shallow or deep</text>
    <text x="645" y="65" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">leaks light through the bottom.</text>
    <text x="645" y="82" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">An Excellent cut bounces 99%+ to you."</text>
  </g>
</svg>